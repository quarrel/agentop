[package]
name = "agentop"
version = "0.1.0"
edition = "2021"
description = "A read-only terminal UI for observing Codex multi-agent rollout sessions"
license = "GPL-2.0-or-later"
repository = "https://github.com/quarrel/agentop"
readme = "README.md"
keywords = ["codex", "tui", "agents", "observability"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "schemas/codex/rollout-line/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE.md",
]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zstd = "0.13"
